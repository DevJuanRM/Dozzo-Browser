<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background luxury gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181c2b" />
      <stop offset="65%" stop-color="#090a0f" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="28%" stop-color="#F0B90B" />
      <stop offset="65%" stop-color="#D98E04" />
      <stop offset="100%" stop-color="#995D00" />
    </linearGradient>

    <!-- High-glow gold core -->
    <radialGradient id="goldOrb" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FFF099" />
      <stop offset="75%" stop-color="#F0B90B" />
      <stop offset="100%" stop-color="#B87700" />
    </radialGradient>

    <!-- Outer rim shine -->
    <linearGradient id="rimShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 230, 100, 0.45)" />
      <stop offset="50%" stop-color="rgba(240, 185, 11, 0.15)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>

    <filter id="goldGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="120" fill="url(#bgGlow)" />
  <rect x="12" y="12" width="488" height="488" rx="108" fill="none" stroke="url(#rimShine)" stroke-width="3" />

  <!-- Central Ambient Gold Aura -->
  <circle cx="256" cy="256" r="160" fill="#F0B90B" opacity="0.12" filter="blur(30px)" />

  <!-- Modern Geometric D Emblem -->
  <g filter="url(#goldGlowFilter)">
    <!-- Vertical stem with rounded ends -->
    <path
      d="M 152 140 L 152 372"
      stroke="url(#goldMetallic)"
      stroke-width="38"
      stroke-linecap="round"
    />

    <!-- Top & Bottom bars connecting into D curve -->
    <path
      d="M 152 140 L 265 140 C 350 140 395 185 395 256 C 395 327 350 372 265 372 L 152 372"
      fill="none"
      stroke="url(#goldMetallic)"
      stroke-width="38"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Glowing Center Orbital Nucleus -->
    <circle cx="270" cy="256" r="30" fill="url(#goldOrb)" />

    <!-- Orbital Dynamic Ring -->
    <ellipse
      cx="256"
      cy="256"
      rx="170"
      ry="90"
      fill="none"
      stroke="rgba(255, 255, 255, 0.75)"
      stroke-width="8"
      stroke-dasharray="180 80 120 70"
      transform="rotate(-28 256 256)"
    />
  </g>
</svg>
